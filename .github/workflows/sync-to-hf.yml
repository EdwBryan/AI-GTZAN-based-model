name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: false

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          HUGGINGFACEHUB_API_TOKEN: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
        run: |
          TOKEN="${HF_TOKEN:-${HF_ACCESS_TOKEN:-$HUGGINGFACEHUB_API_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing Hugging Face token secret. Please set one of: HF_TOKEN, HF_ACCESS_TOKEN, or HUGGINGFACEHUB_API_TOKEN."
            exit 1
          fi
          export TOKEN
          cat > /tmp/hf-askpass.sh <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) echo "EdwBryan" ;;
            *Password*) echo "$TOKEN" ;;
          esac
          EOF
          chmod 700 /tmp/hf-askpass.sh
          GIT_ASKPASS=/tmp/hf-askpass.sh GIT_TERMINAL_PROMPT=0 git push --force https://huggingface.co/spaces/EdwBryan/ai-genre-classifier main
          rm -f /tmp/hf-askpass.sh
